<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>示例网页 - 个人主页</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --accent-color: #50e3c2;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 800px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            margin: 20px 0;
        }

        .header {
            background: linear-gradient(135deg, var(--primary-color), #357abd);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }

        .header h1 {
            margin: 0 0 10px 0;
            font-size: 2.2rem;
        }

        .header p {
            margin: 0;
            opacity: 0.9;
            font-size: 1.1rem;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 1.3rem;
            color: var(--primary-color);
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 8px;
            margin-bottom: 15px;
        }

        .skill-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 0;
            list-style: none;
        }

        .skill-tag {
            background-color: var(--bg-color);
            color: var(--primary-color);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .footer {
            text-align: center;
            padding: 20px;
            background-color: #fafafa;
            border-top: 1px solid #eeeeee;
            font-size: 0.85rem;
            color: #888888;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.2s ease;
        }

        button:hover {
            background-color: #357abd;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>欢迎来到我的个人主页</h1>
            <p>探索、学习与构建</p>
        </div>

        <div class="content">
            <div class="section">
                <h2 class="section-title">关于我</h2>
                <p>你好！这是一份自动生成的 HTML 演示示例文件。包含简洁的样式设计与响应式布局。</p>
            </div>

            <div class="section">
                <h2 class="section-title">技术栈</h2>
                <ul class="skill-list">
                    <li class="skill-tag">Python</li>
                    <li class="skill-tag">JavaScript</li>
                    <li class="skill-tag">HTML5 / CSS3</li>
                    <li class="skill-tag">Pandas</li>
                    <li class="skill-tag">JSON</li>
                </ul>
            </div>

            <div class="section">
                <h2 class="section-title">互动测试</h2>
                <button onclick="alert('你好！这是一个示例点击效果。')">点击测试</button>
            </div>
        </div>

        <div class="footer">
            <p>© 2026 Sample Profile Page. All rights reserved.</p>
        </div>
    </div>

</body>
</html>
